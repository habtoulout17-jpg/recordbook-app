<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#041426">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recordbook">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Recordbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="loading" class="screen"><div class="card"><div class="mark"><b>BK</b>Teach<small>RECORDBOOK</small></div><p class="muted">Opening…</p></div></section>

<section id="signin" class="screen" hidden><div class="card"><div class="mark"><b>BK</b>Teach<small>RECORDBOOK</small></div><h1>Sign in</h1><button type="button" id="signin-btn" class="gold">Continue with Google</button><div class="status" id="signin-status"></div><button type="button" id="signout-btn" class="link" hidden>Use another account</button></div></section>

<section id="code" class="screen" hidden><div class="card"><div class="mark"><b>BK</b>Teach<small>RECORDBOOK</small></div><h1>Recordbook</h1><form id="code-form"><label for="code-input">Access code</label><input id="code-input" class="code" type="password" inputmode="numeric" maxlength="4" autocomplete="off" required><button type="submit" class="gold">Open</button><div class="status" id="code-status"></div></form></div></section>

<section id="key" class="screen" hidden><div class="card wide"><div class="mark"><b>BK</b>Teach<small>RECORDBOOK</small></div><h1>Connect GitHub</h1><p class="muted">Paste your read-only GitHub key once. It is saved in your private database, and only your teacher account can read it.</p><form id="key-form"><input id="key-input" type="password" autocomplete="off" placeholder="github_pat_…"><button type="submit" class="gold">Save key</button></form><div class="status" id="key-status"></div></div></section>

<section id="main" hidden>
  <header>
    <h1>Recordbook <span>2026–2027</span></h1>
    <div class="tools">
      <span id="top-status" role="status"></span>
      <button type="button" id="refresh" title="Load the latest version">↻<span class="lbl"> Refresh</span></button>
      <button type="button" id="pdf" title="Download as PDF">⬇<span class="lbl"> PDF</span></button>
      <button type="button" id="lock" title="Lock">🔒<span class="lbl"> Lock</span></button>
    </div>
  </header>
  <div class="grid">
    <aside>
      <label for="date">Go to date</label><input type="date" id="date">
      <div id="date-status" role="status"></div>
      <nav id="dates" aria-label="Recorded dates"></nav>
      <label for="page">All pages</label><select id="page"></select>
    </aside>
    <section class="viewer">
      <div class="vtools">
        <button type="button" id="prev">‹ Previous</button><span id="page-status"></span><button type="button" id="next">Next ›</button>
        <select id="zoom" aria-label="Zoom"><option value="fit">Fit width</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select>
      </div>
      <div id="page-title"></div>
      <div id="paper-view"><div id="paper-stage"><img id="paper" alt=""></div></div>
      <div id="viewer-status" role="status"></div>
    </section>
  </div>
  <nav id="mbar" aria-label="Page navigation"><button type="button" id="m-prev" aria-label="Previous page">‹</button><div id="m-status"><b id="m-date"></b><span id="m-page"></span></div><button type="button" id="m-next" aria-label="Next page">›</button></nav>
</section>

<dialog id="pdf-dialog">
  <h2>Download PDF</h2>
  <button type="button" class="gold" data-pdf="page">This page</button>
  <button type="button" class="gold" data-pdf="week">This week</button>
  <button type="button" class="gold" data-pdf="all">Whole recordbook</button>
  <div class="status" id="pdf-status"></div>
  <button type="button" class="link" id="pdf-close">Close</button>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
